# ==============================================================================
# FloodWatch Local Development & Staging Multi-Container Compose
# ==============================================================================
# Usage:
#   docker compose up --build
#   docker compose down
#
# Ports:
#   Backend API:      http://localhost:8000 (Docs at /docs)
#   Frontend Web App: http://localhost:3000
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodwatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - APP_NAME=FloodWatch-API
      - DEBUG=true
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:5173", "http://127.0.0.1:5173"]
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - INGESTION_TRIGGER_TOKEN=${INGESTION_TRIGGER_TOKEN:-floodwatch-dev-secret-token}
      - ENABLE_INGESTION_SCHEDULER=false
      - INGESTION_SCHEDULE_INTERVAL_MINUTES=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - floodwatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodwatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - floodwatch-net

networks:
  floodwatch-net:
    driver: bridge
